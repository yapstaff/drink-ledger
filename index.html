<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ドリンク収支帳</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F4EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ドリンク収支帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: 帳簿のような1カラム。受付タブはタブレットで片手の親指でも押せる大きな操作部品に切り替える。 */
:root{
  --bg:#F6F4EE;
  --panel:#FFFFFF;
  --field:#FDFCF9;
  --ink:#262220;
  --ink-soft:#6B6357;
  --ink-faint:#8F8676;
  --line:#DEDACB;
  --line-strong:#262220;
  --accent:#6E2A35;
  --accent-hover:#54202A;
  --on-accent:#FFFFFF;
  --accent-tint:#F3E7E5;
  --good:#3F6355;
  --bad:#954736;
  --warn-bg:#FBF1D9;
  --warn-ink:#6B4E0E;
  --warn-line:#D9A93A;
  --font-display:'Tsukushi A Round Gothic','TsukushiAMaruGothic-Regular','Tsukushi A Round Gothic Regular','筑紫A丸ゴシック','Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
  --font-body:'Tsukushi A Round Gothic','TsukushiAMaruGothic-Regular','Tsukushi A Round Gothic Regular','筑紫A丸ゴシック','Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1819;
    --panel:#242021;
    --field:#2C2728;
    --ink:#EFEAE2;
    --ink-soft:#B5AC9E;
    --ink-faint:#8A8173;
    --line:#3D3637;
    --line-strong:#EFEAE2;
    --accent:#E2A0AB;
    --accent-hover:#EDB6BF;
    --on-accent:#2A1519;
    --accent-tint:#3A2428;
    --good:#8DBBA6;
    --bad:#E39A86;
    --warn-bg:#3A311A;
    --warn-ink:#E8CF8E;
    --warn-line:#B58A2C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1819;
  --panel:#242021;
  --field:#2C2728;
  --ink:#EFEAE2;
  --ink-soft:#B5AC9E;
  --ink-faint:#8A8173;
  --line:#3D3637;
  --line-strong:#EFEAE2;
  --accent:#E2A0AB;
  --accent-hover:#EDB6BF;
  --on-accent:#2A1519;
  --accent-tint:#3A2428;
  --good:#8DBBA6;
  --bad:#E39A86;
  --warn-bg:#3A311A;
  --warn-ink:#E8CF8E;
  --warn-line:#B58A2C;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.6;
  padding-block:24px 96px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing:antialiased;
}
.app{max-width:1040px;margin:0 auto;min-width:0}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;padding-bottom:18px}
.brand{min-width:0}
.brand h1{font-family:var(--font-display);font-size:26px;font-weight:700;margin:0 0 2px;letter-spacing:.02em;line-height:1.3}
.brand p{margin:0;font-size:13px;color:var(--ink-soft)}
.save-status{display:block;min-height:20px;margin-top:6px;font-size:12.5px;color:var(--ink-faint)}
.save-status.is-error{color:var(--bad)}
.total{text-align:right}
.total .cap{font-size:12.5px;color:var(--ink-soft);margin-bottom:2px}
.total .val{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.2}
.total .val.neg{color:var(--bad)}

/* tabs */
.tabs{display:flex;gap:24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tab{position:relative;padding:14px 2px;font:inherit;font-size:15px;color:var(--ink-soft);background:none;border:0;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700}
.tab[aria-selected="true"]::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--accent)}

/* 大きな区分(事前準備 / 当日受付 / 精算・集計) */
.tabs.main{gap:10px;border:0;margin-bottom:14px;overflow:visible}
.gtab{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:64px;font:inherit;text-align:left;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:3px;cursor:pointer}
.gtab:hover{border-color:var(--ink-soft)}
.gtab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.gnum{flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2px solid currentColor;font-weight:700;font-size:15px}
.gtxt{display:flex;flex-direction:column;min-width:0}
.gname{font-size:18px;font-weight:700;line-height:1.3}
.gsub{font-size:12.5px;opacity:.8;line-height:1.35}
.tabs.sub{margin-bottom:24px}
@media (max-width:640px){
  .gtab{padding:10px;gap:8px}
  .gsub{display:none}
  .gname{font-size:16px}
  .gnum{display:none}
  .gtab{justify-content:center;text-align:center}
}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:28px;min-width:0}
.panel + .panel{margin-top:20px}
h2{font-family:var(--font-display);font-size:19px;font-weight:700;margin:0 0 6px;line-height:1.4;text-wrap:balance}
h3{font-size:14px;font-weight:700;color:var(--ink-soft);margin:0 0 12px}
.note{margin:0 0 20px;font-size:13.5px;color:var(--ink-soft);max-width:62ch}
.divider{height:1px;background:var(--line);margin:24px 0}
.empty{color:var(--ink-faint);padding:20px 0;font-size:14px}
.banner{margin:0 0 20px;padding:12px 14px;background:var(--warn-bg);color:var(--warn-ink);border-radius:3px;font-size:13.5px}

/* controls */
label{font-size:12.5px;color:var(--ink-soft)}
input[type=text],input[type=date],input[type=number],select{
  width:100%;padding:10px 12px;font:inherit;font-size:15px;color:var(--ink);
  background:var(--field);border:1px solid var(--line);border-radius:2px;
}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input:disabled{opacity:.45}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);margin:0;flex:none;cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.form-error{margin:12px 0 0;font-size:13.5px;color:var(--bad)}
.btn{padding:10px 20px;font:inherit;font-size:14px;font-weight:700;border-radius:2px;cursor:pointer;border:1px solid transparent}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover:not(:disabled){background:var(--accent-hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn-quiet{background:none;border-color:var(--line);color:var(--ink-soft);font-weight:500}
.btn-quiet:hover{border-color:var(--ink-soft);color:var(--ink)}
.link{background:none;border:0;padding:4px 6px;font:inherit;font-size:13px;color:var(--ink-faint);cursor:pointer}
.link:hover{color:var(--accent);text-decoration:underline}
.link.danger:hover{color:var(--bad)}
.link.strong{color:var(--bad);font-weight:700}
.row-actions{display:flex;gap:2px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.select-wrap{max-width:380px;margin-bottom:22px}

/* tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12.5px;font-weight:700;color:var(--ink-soft);padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{text-align:right}

/* menu rows */
.menu-head,.menu-row{display:grid;grid-template-columns:minmax(0,1.8fr) 120px 120px 90px 110px;gap:12px;align-items:center}
.menu-head{padding:0 0 8px;border-bottom:1px solid var(--line-strong);font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.menu-row{padding:12px 0;border-bottom:1px solid var(--line)}
.menu-row:last-child{border-bottom:0}
.cap-m{display:none}
.gross{text-align:right;font-variant-numeric:tabular-nums}
.add-row{display:grid;grid-template-columns:minmax(0,1.8fr) 120px 120px auto;gap:12px;align-items:end}

/* 材料・仕入れ品・想定杯数 */
.menu-item{border-bottom:1px solid var(--line)}
.menu-item:last-child{border-bottom:0}
.menu-item .menu-row{border-bottom:0;padding-bottom:4px}
.auto-cost{font-variant-numeric:tabular-nums}
.auto-cost small{display:block;font-size:11.5px;color:var(--ink-soft)}
.recipe-line{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:0 0 12px;font-size:13px;color:var(--ink-soft)}
.recipe-line .rt{min-width:0;overflow-wrap:anywhere}
.opt-line{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:0 0 12px;font-size:13px;color:var(--ink-soft)}
.opt-line .rt{min-width:0;overflow-wrap:anywhere}
.recipe-box{margin:6px 0 14px;padding:14px;border:1px solid var(--line-strong);background:var(--accent-tint);border-radius:3px}
.recipe-box h4{margin:0 0 8px;font-size:14px}
.rrow{display:grid;grid-template-columns:minmax(0,1.5fr) 110px auto minmax(0,1.2fr) auto;gap:10px;align-items:center;padding:6px 0}
.rmu{font-size:13px;color:var(--ink-soft);white-space:nowrap}
.rcup{font-size:12.5px;color:var(--ink-soft)}
.item-head,.item-row{display:grid;grid-template-columns:minmax(0,1.4fr) 84px 100px 76px 110px minmax(0,1.7fr) 80px;gap:10px;align-items:center}
.item-head{padding:0 0 8px;border-bottom:1px solid var(--line-strong);font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.item-row{padding:12px 0;border-bottom:1px solid var(--line)}
.item-row:last-of-type{border-bottom:0}
.i-uses{font-size:12.5px;color:var(--ink-soft);line-height:1.6}
.add-item{display:grid;grid-template-columns:minmax(0,1.6fr) 90px 110px 90px 130px auto;gap:12px;align-items:end}
.plan-head,.plan-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) 120px;gap:12px;align-items:center}
.plan-head{padding:0 0 8px;border-bottom:1px solid var(--line-strong);font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.plan-row{padding:12px 0;border-bottom:1px solid var(--line)}
.plan-row:last-of-type{border-bottom:0}
.plan-row.is-off .s-name{color:var(--ink-faint)}
.plan-how{font-size:13px;color:var(--ink-soft);overflow-wrap:anywhere}
.s-name2{min-width:0}
.s-name2 .sn{font-size:15px;font-weight:600}
.s-sub{font-size:12px;color:var(--ink-soft);line-height:1.5;font-weight:400;white-space:normal}
.s-need{font-size:12px;color:var(--accent);line-height:1.5}
@media (max-width:900px){
  .plan-head,.item-head{display:none}
  .plan-row{grid-template-columns:1fr 1fr;gap:8px 12px}
  .plan-row .s-name,.plan-row .plan-how{grid-column:1 / -1}
  .plan-row .cap-m,.item-row .cap-m{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px}
  .item-row{grid-template-columns:1fr 1fr;gap:10px 12px;padding:16px 0}
  .item-row > div:first-child,.item-row .i-uses,.item-row .row-actions{grid-column:1 / -1}
  .add-item{grid-template-columns:1fr 1fr}
  .add-item .field:first-child{grid-column:1 / -1}
  .rrow{grid-template-columns:minmax(0,1fr) 100px auto}
  .rrow .rcup{grid-column:1 / -1}
  .stock-row .s-name2{grid-column:1 / -1}
}

/* stock rows */
.stock-head,.stock-row{display:grid;grid-template-columns:minmax(0,1.4fr) 86px 86px 86px 64px 150px minmax(0,1fr);gap:10px;align-items:center}
.stock-head{padding:0 0 8px;border-bottom:1px solid var(--line-strong);font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.stock-row{padding:14px 0;border-bottom:1px solid var(--line)}
.stock-row:last-of-type{border-bottom:0}
.stock-row.is-off .s-name{color:var(--ink-faint)}
.s-name{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer;font-size:15px}
.s-name .price{color:var(--ink-soft);font-size:13.5px;font-variant-numeric:tabular-nums}
.add-stock{display:flex;gap:8px;align-items:center}
.add-stock input{width:80px;flex:none}
.stock-row .cap-m{display:none}
.carry-hint .btn{background:var(--panel);color:var(--accent);border-color:var(--accent)}
.pool-row .btn{background:var(--panel);color:var(--accent);border-color:var(--accent)}
.carry-hint{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 18px;padding:12px 14px;border:1px solid var(--line-strong);background:var(--accent-tint);border-radius:3px;font-size:14px}
.carry-hint.stack{display:block}
.pool-row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.pool-row:first-of-type{margin-top:10px}
.soft{margin-left:10px;color:var(--ink-soft);font-size:12.5px}
.tin{width:100px;text-align:right;padding:6px 8px}
.rem-ok{font-variant-numeric:tabular-nums}
.rem-low{font-variant-numeric:tabular-nums;color:var(--warn-ink);font-weight:700}
.rem-out{font-variant-numeric:tabular-nums;color:var(--bad);font-weight:700}

/* summary */
.sums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:20px}
.sum .cap{font-size:12.5px;color:var(--ink-soft);margin-bottom:4px}
.sum .amt{font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.amt.pos{color:var(--good)}
.amt.neg{color:var(--bad)}
.foot-sum{display:flex;gap:28px;flex-wrap:wrap;margin-top:8px;padding-top:20px;border-top:1px solid var(--line-strong)}

/* ---- 受付(タブレット向け) ---- */
.recv-top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.recv-top .select-wrap{margin:0;flex:1 1 260px}
.counts{display:flex;gap:28px}
.count .cap{font-size:13px;color:var(--ink-soft)}
.count .big{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.count .big small{font-size:16px;font-weight:500;margin-left:2px;color:var(--ink-soft)}
.alert{margin:0 0 20px;padding:14px 16px;border:2px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-ink);border-radius:3px;font-size:16px;font-weight:700}
.alert ul{margin:6px 0 0;padding-left:20px;font-weight:500}
.people{margin-bottom:22px}
.people-head{display:flex;justify-content:space-between;align-items:center;gap:10px 24px;flex-wrap:wrap;margin-bottom:10px}
.people-head .gl{margin:0;font-size:16px;font-weight:700;color:var(--ink)}
.ptotal{margin-left:12px;font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:12px}
.pcell,.punk{display:flex;flex-direction:column;align-items:stretch;gap:8px;border:2px solid var(--line);border-radius:3px;background:var(--field);padding:12px 12px 12px 14px;min-width:0}
.pcell .pctl{justify-content:space-between}
.pcell .pctl .n{flex:1}
.pcell .pp{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pcell.quiet{padding:8px 10px;gap:4px}
.pcell.quiet .pl{font-size:14px;font-weight:500;color:var(--ink-soft)}
.pcell.quiet .pctl button{width:44px;min-height:44px;font-size:22px}
.pcell.quiet .pctl .n{font-size:22px}
.pcell.on{border-color:var(--accent)}
.pl{font-size:19px;font-weight:700;overflow-wrap:anywhere}
.punk{padding:4px 8px 4px 14px}
.punk .pl{font-size:15px;font-weight:500;color:var(--ink-soft)}
.pctl{display:flex;align-items:stretch;gap:8px;flex:none}
.pctl button{width:56px;min-height:56px;font:inherit;font-size:28px;line-height:1;border-radius:3px;cursor:pointer;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
.pctl button:disabled{opacity:.3;cursor:default}
.pctl .plus{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.pctl .plus:hover{background:var(--accent-hover)}
.pctl .n{min-width:46px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.punk .pctl button{width:44px;min-height:44px;font-size:22px}
.punk .pctl .n{font-size:22px;min-width:34px}
.cart-sum .what.warn{color:var(--bad);font-size:14px}
.group .gl{font-size:14px;color:var(--ink-soft);margin-bottom:8px}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{min-width:132px;min-height:56px;padding:0 20px;font:inherit;font-size:19px;color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:3px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.mode-switch{margin:0 0 20px}
.none-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:16px 0 0}
.none-btn{min-height:52px;padding:0 22px;font:inherit;font-size:18px;color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:3px;cursor:pointer}
.none-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.none-row .soft{font-size:13px;color:var(--ink-soft);flex:1 1 220px}
.d-extra{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);text-align:right}
.final-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.final-card{border:1px solid var(--line-strong);border-radius:3px;padding:18px 20px;background:var(--field)}
.final-card h3{margin:0 0 4px;font-size:15px}
.final-amt{font-family:var(--font-display);font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;margin:0 0 10px}
.final-amt.pos{color:var(--good,inherit)}
.final-amt.neg{color:var(--bad)}
.split-table td{padding:10px 8px;border-bottom:1px solid var(--line)}
.split-table tr.strong td{font-weight:700}
.split-table .indent{display:inline-block;padding-left:18px;color:var(--ink-soft)}
.stepn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;margin-right:10px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:700}
.people-head .gl .soft{font-weight:500}
.fee-seg button{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:64px;padding:8px 18px;text-align:left}
.fee-seg .fs-name{font-size:19px}
.fee-seg .fs-price,.fee-seg .fs-n{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;opacity:.85}
.fee-seg .fs-n{font-weight:700;opacity:1}
.first-check{display:flex;gap:16px;align-items:center;padding:14px 16px;border:2px solid var(--line);border-radius:3px;background:var(--field);cursor:pointer}
.first-check:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.first-check input{width:32px;height:32px}
.first-check strong{display:block;font-size:19px}
.first-check small{display:block;margin-top:2px;font-size:13.5px;color:var(--ink-soft)}
.tin.wide{width:100%;min-width:140px;text-align:left}
.tsel{width:auto;min-width:120px;padding:6px 8px}
.inline-chk{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.fee-pick{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 28px}
.kind{display:inline-block;margin-right:8px;padding:1px 8px;font-size:12px;border:1px solid var(--line-strong);border-radius:2px;color:var(--ink-soft)}
.one-opt{display:flex;gap:12px;align-items:center;cursor:pointer;font-size:15px;min-height:44px}
.attr-note{margin:10px 0 0;font-size:13px;color:var(--ink-faint)}
.drink-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.drink{border:2px solid var(--line);border-radius:3px;padding:16px 18px;background:var(--field);min-width:0}
.drink.low{border-color:var(--warn-line);background:var(--warn-bg)}
.drink.out{border-color:var(--bad)}
.drink.in-cart{border-color:var(--accent)}
.d-head{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.d-name{font-size:22px;font-weight:700;overflow-wrap:anywhere}
.d-price{font-size:15px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.d-stats{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 14px;font-size:16px;font-variant-numeric:tabular-nums}
.d-stats .lbl{color:var(--ink-soft);font-size:13px;margin-right:4px}
.d-stats .low-t{color:var(--warn-ink);font-weight:700}
.d-stats .out-t{color:var(--bad);font-weight:700}
.d-flag{display:inline-block;margin-left:6px;font-size:12.5px;font-weight:700}
.cartstep{display:grid;grid-template-columns:64px minmax(0,1fr) 88px;gap:10px;align-items:stretch}
.cartstep button{min-height:64px;font:inherit;font-size:30px;line-height:1;border-radius:3px;cursor:pointer;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
.cartstep button:disabled{opacity:.3;cursor:default}
.cartstep .plus{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.cartstep .plus:hover{background:var(--accent-hover)}
.cartstep .n{display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.cart-bar{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:24px -28px -28px;padding:14px 28px calc(14px + env(safe-area-inset-bottom, 0px));background:var(--panel);border-top:2px solid var(--line-strong)}
.cart-btns{display:flex;gap:10px;margin-left:auto}
.cart-sum{flex:1 1 220px;min-width:0}
.cart-sum .cap{font-size:12.5px;color:var(--ink-soft)}
.cart-sum .what{font-size:16px;overflow-wrap:anywhere}
.cart-sum .what.dim{color:var(--ink-faint)}
.cart-sum .pay{font-family:var(--font-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-left:10px}
.btn-lg{min-height:60px;padding:0 28px;font-size:18px}
.recent{margin-top:34px}
.recent-row{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.recent-row:last-child{border-bottom:0}
.recent-row .who{color:var(--ink-soft);font-size:13.5px}
.recent-row .t{font-variant-numeric:tabular-nums;color:var(--ink-faint);margin-right:8px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,0);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:3px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

@media (max-width:900px){
  .stock-head{display:none}
  .stock-row{grid-template-columns:1fr 1fr 1fr;gap:10px 12px;padding:16px 0}
  .stock-row .s-name{grid-column:1 / -1}
  .stock-row .add-stock{grid-column:auto}
  .stock-row > div:last-child{grid-column:1 / -1}
  .stock-row .cap-m{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px}
}
@media (max-width:640px){
  .pgrid{grid-template-columns:repeat(var(--cols-s,2),minmax(0,1fr))}
  .panel{padding:18px}
  .cart-bar{margin:20px -18px -18px;padding-left:18px;padding-right:18px}
  .total{text-align:left}
  .menu-head{display:none}
  .menu-row{grid-template-columns:1fr 1fr;gap:10px 12px;padding:16px 0}
  .menu-row .m-name{grid-column:1 / -1}
  .cap-m{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px}
  .menu-row .gross{text-align:left}
  .menu-row .row-actions{justify-content:flex-start}
  .add-row{grid-template-columns:1fr 1fr}
  .add-row .field:first-child{grid-column:1 / -1}
  .pgrid{grid-template-columns:1fr}
}
/* ログイン・接続設定の画面 */
#boot{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);overflow:auto}
#boot[hidden]{display:none}
.boot-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:28px}
.boot-card h1{font-family:var(--font-display);font-size:24px;margin:0 0 10px}
.boot-card label{display:block;margin:16px 0 4px;font-size:13px;color:var(--ink-soft)}
.boot-card input{width:100%;padding:12px;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:2px}
.boot-card button{width:100%;margin-top:20px;padding:14px;font:inherit;font-size:16px;font-weight:700;color:var(--on-accent);background:var(--accent);border:0;border-radius:2px;cursor:pointer}
.boot-card button:disabled{opacity:.6}
.boot-note{margin:0;font-size:14px;color:var(--ink-soft)}

.file-in{font:inherit;font-size:14px;max-width:100%}
.imp-box{margin-top:16px;padding:14px 16px;border:1px solid var(--line-strong);background:var(--accent-tint);border-radius:3px;font-size:14px}

<body>
<div id="boot" hidden></div>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script>
(function(){
  'use strict';

  /* お客さんの属性。項目を足すときはここに追加する。 */
  var ATTRS = [
    {key: 'g', label: '性別', opts: [['m', '男性'], ['f', '女性']]},
    {key: 'o', label: '区分', opts: [['s', '学生'], ['w', '社会人']]}
  ];

  var state = {
    menu: [],
    items: [],
    recipeEdit: null,
    events: [],
    records: [],
    tab: 'events',
    editingEventId: null,
    recvEventId: null,
    firstDrink: true,
    recvFee: null,
    feeEventId: null,
    fees: [],
    stockEventId: null,
    expenseEventId: null,
    reportScope: 'all',
    cart: {people: {}, items: {}, none: false},
    optEdit: null,
    confirm: null,        // {kind, id}
    formError: null,      // {scope, msg}
    loaded: false,
    dbOk: null,           // null: 確認中, true: 保存できる, false: 保存できない
    save: 'idle'          // idle | saving | saved | error | local
  };
  var db = null;
  var pending = new Set();   // 書き込み中のドキュメント(サーバーからの更新で上書きしない)
  var writers = new Map();
  var needsRender = false;
  var recIdx = null;

  /* ---------- helpers ---------- */
  function $(s, r){ return (r || document).querySelector(s); }
  function esc(s){
    if (s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function uid(){ return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
  function yen(n){ return '¥' + Math.round(n || 0).toLocaleString('ja-JP'); }
  function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
  function fmtDate(d){
    if (!d) return '日付未設定';
    var p = d.split('-');
    if (p.length !== 3) return d;
    return p[0] + '年' + parseInt(p[1], 10) + '月' + parseInt(p[2], 10) + '日';
  }
  function fmtTime(t){
    var d = new Date(t);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function toast(msg){
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2000);
  }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function attrLabel(key, v){
    var a = ATTRS.filter(function(x){ return x.key === key; })[0];
    if (!a) return '';
    var o = a.opts.filter(function(x){ return x[0] === v; })[0];
    return o ? o[1] : '';
  }
  /* 人数は「性別|区分」の組み合わせごとに数える。分からない人のキーは '|' */
  function personKey(g, o, fid){ return (g || '') + '|' + (o || '') + (fid ? '|' + fid : ''); }
  function peopleTotal(p){
    var s = 0;
    Object.keys(p || {}).forEach(function(k){ s += Math.max(0, Math.floor(num(p[k]))); });
    return s;
  }
  function personLabel(key, rec){
    var p = key.split('|'), fid = p[2] || '';
    var fname = (rec && rec.feeNames && rec.feeNames[fid]) || (feeById(fid) ? feeById(fid).name : '');
    var parts = [attrLabel(ATTRS[0].key, p[0]), fname || attrLabel(ATTRS[1].key, p[1])].filter(Boolean);
    return parts.length ? parts.join('・') : '属性不明';
  }
  /* 前のバージョンの記録(1件=1人、属性は a)も読めるようにする */
  function legacyPeople(d){
    if (d.people && typeof d.people === 'object') return clone(d.people);
    var a = (d.a && typeof d.a === 'object') ? d.a : {};
    var p = {};
    p[personKey(a[ATTRS[0].key], a[ATTRS[1].key])] = 1;
    return p;
  }

  /* ---------- data access ---------- */
  function sortedMenu(){ return state.menu.slice().sort(function(a, b){ return (a.order || 0) - (b.order || 0); }); }
  function sortedFees(){ return state.fees.slice().sort(function(a, b){ return (a.order || 0) - (b.order || 0); }); }
  function feeById(id){ return id ? state.fees.filter(function(f){ return f.id === id; })[0] : null; }
  /* 受付に出す参加費の種類(このイベントで使うもの) */
  function eventFees(ev){
    var all = sortedFees();
    if (!all.length) return [{id: '_s', name: '学生', price: 0, o: 's', std: true}, {id: '_w', name: '社会人', price: 0, o: 'w', std: true}];
    var list = ev.feeIds ? all.filter(function(f){ return ev.feeIds.indexOf(f.id) !== -1; }) : all.filter(function(f){ return f.std; });
    return list.length ? list : all;
  }
  function feeFor(id){
    if (id === '_s') return {id: id, name: '学生', price: 0, o: 's'};
    if (id === '_w') return {id: id, name: '社会人', price: 0, o: 'w'};
    return feeById(id);
  }
  /* 参加受付の記録1件の参加費(記録した時の金額で計算) */
  function recFee(r){
    if (r.kind !== 'entry') return 0;
    if (!Object.keys(r.feePrices).length) return Math.max(0, num(r.fee)) * peopleTotal(r.people);
    var t = 0;
    Object.keys(r.people).forEach(function(k){
      var fid = k.split('|')[2];
      if (fid && r.feePrices[fid] !== undefined) t += Math.max(0, Math.floor(num(r.people[k]))) * Math.max(0, num(r.feePrices[fid]));
    });
    return t;
  }
  function sortedEvents(){
    return state.events.slice().sort(function(a, b){
      return (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0);
    });
  }
  function drinkById(id){ return state.menu.find(function(m){ return m.id === id; }); }
  function eventById(id){ return state.events.find(function(e){ return e.id === id; }); }
  function recsOf(evId){
    if (!recIdx){
      recIdx = {};
      state.records.forEach(function(r){ (recIdx[r.eventId] = recIdx[r.eventId] || []).push(r); });
    }
    return recIdx[evId] || [];
  }
  function recordsChanged(){ recIdx = null; }
  function defaultEvent(){
    if (!state.events.length) return null;
    var today = Date.parse(todayStr());
    function dist(e){ return e.date ? Math.abs(Date.parse(e.date) - today) : Infinity; }
    return state.events.slice().sort(function(a, b){
      return dist(a) - dist(b) || (b.date || '').localeCompare(a.date || '');
    })[0];
  }
  function pickEvent(key){
    var cur = state[key] && eventById(state[key]);
    if (!cur){ cur = defaultEvent(); if (cur) state[key] = cur.id; }
    return cur;
  }

  function normMenu(id, d){
    return {
      id: id, name: String(d.name || ''), price: num(d.price),
      cost: (d.cost === null || d.cost === undefined || d.cost === '') ? null : num(d.cost),
      recipe: Array.isArray(d.recipe) ? d.recipe.map(function(x){ x = x || {}; return {itemId: String(x.itemId || ''), amount: Math.max(0, num(x.amount))}; }) : [],
      priceRefill: (d.priceRefill === null || d.priceRefill === undefined || d.priceRefill === '') ? null : Math.max(0, num(d.priceRefill)),
      payee: d.payee === 'partner' ? 'partner' : 'own', entryExtra: Math.max(0, num(d.entryExtra)),
      order: num(d.order)
    };
  }
  function normItem(id, d){
    return {id: id, name: String(d.name || ''), unit: String(d.unit || '本'), size: num(d.size) > 0 ? num(d.size) : 1, mu: String(d.mu || 'ml'),
      price: (d.price === null || d.price === undefined || d.price === '') ? null : Math.max(0, num(d.price)), order: num(d.order)};
  }
  function normEvent(id, d){
    return {
      id: id, name: String(d.name || ''), date: String(d.date || ''), venue: String(d.venue || ''),
      menuIds: Array.isArray(d.menuIds) ? d.menuIds.slice() : [],
      stock: (d.stock && typeof d.stock === 'object') ? clone(d.stock) : {},
      alertAt: (d.alertAt && typeof d.alertAt === 'object') ? clone(d.alertAt) : {},
      oneDrink: d.oneDrink === true, firstPaid: d.firstPaid === true, partner: String(d.partner || ''), ownName: String(d.ownName || ''), feeIds: Array.isArray(d.feeIds) ? d.feeIds.slice() : null,
      carryIn: (d.carryIn && typeof d.carryIn === 'object') ? clone(d.carryIn) : {},
      plan: (d.plan && typeof d.plan === 'object') ? clone(d.plan) : {},
      expenses: Array.isArray(d.expenses) ? d.expenses.map(function(x){
        x = x || {};
        return {id: String(x.id || uid()), label: String(x.label || ''), amount: num(x.amount),
          kind: x.kind === 'carry' ? 'carry' : 'new', carryOut: num(x.carryOut), from: x.from ? String(x.from) : '',
          bearer: x.bearer === 'partner' ? 'partner' : 'own', source: String(x.source || '')};
      }) : [],
      createdAt: num(d.createdAt)
    };
  }
  function normRecord(id, d){
    return {
      id: id, eventId: String(d.eventId || ''), t: num(d.t),
      people: legacyPeople(d),
      items: (d.items && typeof d.items === 'object') ? clone(d.items) : {},
      prices: (d.prices && typeof d.prices === 'object') ? clone(d.prices) : {},
      names: (d.names && typeof d.names === 'object') ? clone(d.names) : {},
      kind: (d.kind === 'entry' || d.kind === 'extra' || d.kind === 'first') ? d.kind : '', fee: Math.max(0, num(d.fee)),
      payees: (d.payees && typeof d.payees === 'object') ? clone(d.payees) : {},
      extras: (d.extras && typeof d.extras === 'object') ? clone(d.extras) : {},
      feeShares: (d.feeShares && typeof d.feeShares === 'object') ? clone(d.feeShares) : {},
      feePrices: (d.feePrices && typeof d.feePrices === 'object') ? clone(d.feePrices) : {},
      feeNames: (d.feeNames && typeof d.feeNames === 'object') ? clone(d.feeNames) : {}
    };
  }
  function normFee(id, d){
    return {id: id, name: String(d.name || ''), price: Math.max(0, num(d.price)), o: (d.o === 's' || d.o === 'w') ? d.o : '', std: d.std !== false, share: Math.max(0, num(d.share)), order: num(d.order)};
  }
  function feeDoc(f){ return {name: f.name, price: f.price, o: f.o, std: !!f.std, share: f.share || 0, order: f.order}; }
  function menuDoc(m){ return {name: m.name, price: m.price, cost: m.cost, recipe: m.recipe.map(function(x){ return {itemId: x.itemId, amount: x.amount}; }), priceRefill: m.priceRefill, payee: m.payee, entryExtra: m.entryExtra, order: m.order}; }
  function itemDoc(i){ return {name: i.name, unit: i.unit, size: i.size, mu: i.mu, price: i.price, order: i.order}; }
  function eventDoc(e){
    return {name: e.name, date: e.date, venue: e.venue, menuIds: e.menuIds, stock: e.stock, alertAt: e.alertAt, carryIn: e.carryIn, plan: e.plan, oneDrink: !!e.oneDrink, firstPaid: !!e.firstPaid, partner: e.partner || '', ownName: e.ownName || '', feeIds: e.feeIds || null, expenses: e.expenses, createdAt: e.createdAt};
  }
  function recordDoc(r){ return {eventId: r.eventId, t: r.t, people: r.people, items: r.items, prices: r.prices, names: r.names, kind: r.kind || '', fee: r.fee || 0, feePrices: r.feePrices || {}, feeNames: r.feeNames || {}, payees: r.payees || {}, extras: r.extras || {}, feeShares: r.feeShares || {}}; }

  /* ---------- 計算 ---------- */
  function soldMap(evId){
    var m = {};
    recsOf(evId).forEach(function(r){
      Object.keys(r.items).forEach(function(id){ m[id] = (m[id] || 0) + Math.max(0, Math.floor(num(r.items[id]))); });
    });
    return m;
  }
  /* 経費1行のうち、今回の費用になる額(金額−次回に持ち越す額) */
  function expCarry(e){
    var a = Math.max(0, num(e.amount));
    return Math.min(Math.max(0, num(e.carryOut)), a);
  }
  function expUsed(e){ return Math.max(0, num(e.amount)) - expCarry(e); }
  /* ドリンクの価格。おかわり(2杯目以降)の価格が決まっていれば、おかわりのときはそちらを使う */
  function drinkPrice(d, mode){
    if (mode === 'extra' && d.priceRefill !== null && d.priceRefill !== undefined) return d.priceRefill;
    return d.price;
  }
  function partnerName(ev){ return (ev && ev.partner) ? ev.partner : '相手'; }
  /* 受付の記録1件について、預かった金額と、そのうち相手に渡す金額(記録した時点の設定で計算) */
  function recSplit(r){
    var fee = recFee(r), feeP = 0, drinkAmt = 0, drinkP = 0, sur = 0, surP = 0;
    if (r.kind === 'entry'){
      Object.keys(r.people).forEach(function(k){
        var fid = k.split('|')[2];
        if (fid && r.feeShares[fid] !== undefined) feeP += Math.max(0, Math.floor(num(r.people[k]))) * Math.max(0, num(r.feeShares[fid]));
      });
      feeP = Math.min(feeP, fee);
      Object.keys(r.items).forEach(function(id){
        var q = Math.max(0, Math.floor(num(r.items[id]))), ex = Math.max(0, num(r.extras[id]));
        sur += ex * q;
        if (r.payees[id] === 'partner') surP += ex * q;
      });
    } else {
      Object.keys(r.items).forEach(function(id){
        var q = Math.max(0, Math.floor(num(r.items[id])));
        var d = drinkById(id);
        var price = (r.prices[id] !== undefined) ? num(r.prices[id]) : (d ? d.price : 0);
        drinkAmt += price * q;
        if (r.payees[id] === 'partner') drinkP += price * q;
      });
    }
    return {fee: fee, feeP: feeP, drinkAmt: drinkAmt, drinkP: drinkP, sur: sur, surP: surP};
  }
  function eventFinance(ev){
    var drinkRev = 0, entry = 0, surcharge = 0, cost = 0, cups = 0, freeCups = 0, entryP = 0, drinkP = 0, surP = 0;
    var recs = recsOf(ev.id);
    recs.forEach(function(r){
      var sp = recSplit(r);
      entry += sp.fee; drinkRev += sp.drinkAmt; surcharge += sp.sur;
      entryP += sp.feeP; drinkP += sp.drinkP; surP += sp.surP;
      Object.keys(r.items).forEach(function(id){
        var q = Math.max(0, Math.floor(num(r.items[id])));
        var d = drinkById(id);
        if (r.kind === 'entry') freeCups += q;
        cost += (d ? (drinkCost(d) || 0) : 0) * q;
        cups += q;
      });
    });
    /* 預かった金額(受付に入ったお金)と、そのうち相手に渡す分・自分たち(YAP)の取り分 */
    var revenue = drinkRev + entry + surcharge;
    var partnerRev = entryP + drinkP + surP;
    var ownRev = revenue - partnerRev;
    /* 経費: 自分たちが負担する分だけを利益に入れる(今回使った分。前回の残りを使えば今回の費用、次回に回す分は外れる) */
    var expense = 0, partnerExp = 0, paid = 0;
    ev.expenses.forEach(function(e){
      var u = expUsed(e);
      if (e.bearer === 'partner') partnerExp += u;
      else { expense += u; if (e.kind !== 'carry') paid += Math.max(0, num(e.amount)); }
    });
    var carryOut = ev.expenses.reduce(function(a, e){ return a + expCarry(e); }, 0);
    var sold = soldMap(ev.id);
    var purchase = 0, leftover = 0;
    stockLines(ev).forEach(function(l){
      var c = l.price || 0;
      purchase += c * Math.max(0, Math.floor(num(ev.stock[l.key])));
      var rem = lineRem(ev, l, sold);
      if (rem !== null) leftover += c * Math.max(0, rem);
    });
    var visitors = recs.reduce(function(a, r){ return a + peopleTotal(r.people); }, 0);
    return {
      revenue: revenue, entry: entry, drinkRev: drinkRev, surcharge: surcharge, freeCups: freeCups, cost: cost, expense: expense, cups: cups, visitors: visitors,
      partnerRev: partnerRev, ownRev: ownRev, partnerExp: partnerExp, entryP: entryP, drinkP: drinkP, surP: surP,
      profit: ownRev - cost - expense, partnerProfit: partnerRev - partnerExp,

  }
  /* 支払い元ごとの、備品などの支払い額(前回の残りを使った分は、今回は払っていないので入れない) */
  function sourceTotals(events){
    var m = {}, order = [];
    events.forEach(function(ev){
      ev.expenses.forEach(function(e){
        if (e.kind === 'carry') return;
        var k = e.source || '(支払い元なし)';
        if (!m[k]){ m[k] = {name: k, own: 0, partner: 0}; order.push(k); }
        m[k][e.bearer === 'partner' ? 'partner' : 'own'] += Math.max(0, num(e.amount));
      });
    });
    return order.map(function(k){ return m[k]; });
  }
  function totalFinance(events){
    var t = {revenue: 0, entry: 0, drinkRev: 0, freeCups: 0, cost: 0, expense: 0, cups: 0, visitors: 0, profit: 0, paid: 0, purchase: 0, cash: 0, leftover: 0, carryOut: 0, surcharge: 0, partnerProfit: 0, partnerRev: 0, ownRev: 0, partnerExp: 0, entryP: 0, drinkP: 0, surP: 0};
    events.forEach(function(ev){
      var f = eventFinance(ev);
      Object.keys(t).forEach(function(k){ t[k] += f[k]; });

  }
  function ranking(events){
    var map = {};
    events.forEach(function(ev){
      recsOf(ev.id).forEach(function(r){
        Object.keys(r.items).forEach(function(id){
          var q = Math.max(0, Math.floor(num(r.items[id])));
          if (!q) return;
          var d = drinkById(id);
          var price = (r.prices[id] !== undefined) ? num(r.prices[id]) : (d ? d.price : 0);
          if (!map[id]) map[id] = {name: d ? d.name : (r.names[id] || '削除したドリンク'), qty: 0, revenue: 0, free: 0};
          map[id].qty += q;
          if (r.kind === 'entry') map[id].free += q; else map[id].revenue += price * q;
        });
      });
    });
    return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a, b){
      return b.qty - a.qty || a.name.localeCompare(b.name, 'ja');
    });
  }
  function drinksMissingCost(events){
    var names = {};
    events.forEach(function(ev){
      var sold = soldMap(ev.id);
      stockLines(ev).forEach(function(l){
        if (l.price !== null) return;
        if (lineUsed(l, sold) > 0 || num(ev.stock[l.key]) > 0 || num(ev.carryIn[l.key]) > 0) names[l.name] = true;

  }

  /* ---------- 仕入れ品(材料)・1杯の量・在庫 ---------- */
  /* 在庫は「仕入れの単位(本・缶など)」で数える。ビールのように1杯=1本のドリンクは、そのドリンク自身が在庫の1行になる。
     ウイスキーや炭酸水のように何杯も作る材料は、仕入れ品として登録し、ドリンクごとに「1杯あたりの量」を決める。 */
  function r3(n){ return Math.round(n * 1000) / 1000; }
  function r6(n){ return Math.round(n * 1000000) / 1000000; }
  function fq(n){ return String(Math.round(num(n) * 100) / 100); }
  function sortedItems(){ return state.items.slice().sort(function(a, b){ return (a.order || 0) - (b.order || 0); }); }
  function itemById(id){ return id ? state.items.filter(function(i){ return i.id === id; })[0] : null; }
  function itemSize(it){ return it.size > 0 ? it.size : 1; }
  function activeRecipe(d){
    return (d.recipe || []).filter(function(x){ return x.amount > 0 && itemById(x.itemId); });
  }
  function hasRecipe(d){ return activeRecipe(d).length > 0; }
  /* 1杯の原価。材料があれば「材料の値段÷1単位の量×1杯の量」の合計、なければメニューに入れた原価 */
  function drinkCost(d){
    if (d.payee === 'partner') return 0;
    var rec = activeRecipe(d);
    if (!rec.length) return d.cost;
    var t = 0, any = false;
    rec.forEach(function(x){
      var it = itemById(x.itemId);
      if (it.price !== null){ t += it.price / itemSize(it) * x.amount; any = true; }
    });
    return any ? t : null;
  }
  function drinkCostPartial(d){
    return activeRecipe(d).some(function(x){ return itemById(x.itemId).price === null; });
  }
  /* このイベントの在庫の行(出すドリンクが使うものを、重ならないようにまとめる) */
  function stockLines(ev){
    var map = {}, order = [];
    function line(key, make){
      if (!map[key]){ map[key] = make(); order.push(key); }
      return map[key];
    }
    eventDrinks(ev).forEach(function(d){
      var rec = activeRecipe(d);
      if (!rec.length){
        line(d.id, function(){ return {key: d.id, kind: 'drink', name: d.name, unit: '本', size: 1, mu: '', price: d.payee === 'partner' ? 0 : d.cost, uses: []}; })
          .uses.push({drink: d, amount: 1});
      } else {
        rec.forEach(function(x){
          var it = itemById(x.itemId);
          line(it.id, function(){ return {key: it.id, kind: 'item', name: it.name, unit: it.unit, size: itemSize(it), mu: it.mu, price: it.price, uses: []}; })
            .uses.push({drink: d, amount: x.amount});
        });
      }
    });
    /* 使うドリンクが選ばれていなくても、持ち越しや仕入れの入力がある仕入れ品は、残りを見失わないように並べる */
    sortedItems().forEach(function(it){
      if (map[it.id]) return;
      if (ev.stock[it.id] === undefined && ev.carryIn[it.id] === undefined) return;
      line(it.id, function(){ return {key: it.id, kind: 'item', name: it.name, unit: it.unit, size: itemSize(it), mu: it.mu, price: it.price, uses: []}; });
    });
    return order.map(function(k){ return map[k]; });
  }
  function keyInfo(key){
    var d = drinkById(key);
    if (d) return {name: d.name, unit: '本'};
    var it = itemById(key);
    return it ? {name: it.name, unit: it.unit} : null;
  }
  /* 売れた杯数から、その行を何単位使ったか */
  function lineUsed(l, sold){
    var u = 0;
    l.uses.forEach(function(x){ u += (sold[x.drink.id] || 0) * x.amount / l.size; });
    return u;
  }
  /* 在庫: 前回からの持ち越し + 今回の仕入れ(入力がなければ null) */
  function stockTotal(ev, id){
    var c = ev.carryIn[id], s = ev.stock[id];
    var noC = (c === undefined || c === null), noS = (s === undefined || s === null);
    if (noC && noS) return null;
    return num(c) + num(s);
  }
  function lineRem(ev, l, sold){
    var t = stockTotal(ev, l.key);
    return t === null ? null : t - lineUsed(l, sold);
  }
  function lineLevel(ev, l, rem){
    if (rem === null) return 'none';
    var need = l.uses.length ? Math.min.apply(null, l.uses.map(function(x){ return x.amount / l.size; })) : 0;
    if (rem <= 0 || rem < need - 1e-9) return 'out';
    var a = ev.alertAt[l.key];
    if (a !== undefined && a !== null && rem <= num(a) + 1e-9) return 'low';
    return 'ok';
  }
  /* ドリンク1種類で、あと何杯作れるか(材料のうち一番少ないもので決まる) */
  function stockState(ev, id, sold){
    var cups = null, lv = 'none';
    stockLines(ev).forEach(function(l){
      var use = l.uses.filter(function(x){ return x.drink.id === id; })[0];
      if (!use) return;
      var rem = lineRem(ev, l, sold);
      if (rem === null) return;
      var c = Math.floor((rem * l.size + 1e-6) / use.amount);
      cups = cups === null ? c : Math.min(cups, c);
      var v = lineLevel(ev, l, rem);
      if (v === 'out' || lv === 'out') lv = 'out';
      else if (v === 'low' || lv === 'low') lv = 'low';
      else lv = 'ok';
    });
    if (cups === null) return {rem: null, level: 'none'};
    if (cups <= 0) lv = 'out';

  }
  /* 材料の残りで、各ドリンクをあと何杯作れるか(材料のドリンクだけ) */
  function lineCupsText(l, rem){
    if (l.kind !== 'item' || rem === null || !l.uses.length) return '';
    return l.uses.map(function(x){
      return esc(x.drink.name) + ' 約' + Math.max(0, Math.floor((rem * l.size + 1e-6) / x.amount)) + '杯';

  }
  /* 想定杯数から、この行を何単位使う見込みか */
  function planNeed(ev, l){

  function planBuy(ev, l){

  }
  function isBefore(a, b){

  }
  /* 前回までに「次回に持ち越す」とした備品のうち、まだ誰も使っていないもの */
  function expensePool(forEv){
    var consumed = {};
    state.events.forEach(function(e){ e.expenses.forEach(function(x){ if (x.from) consumed[x.from] = true; }); });
    var out = [];
    state.events.forEach(function(e){
      if (forEv && (e.id === forEv.id || !isBefore(e, forEv))) return;
      e.expenses.forEach(function(x){
        var c = expCarry(x);
        if (c > 0 && !consumed[x.id]) out.push({id: x.id, label: x.label, value: c, eventName: e.name, eventDate: e.date, bearer: x.bearer, source: x.source});
      });

  }
  function eventDrinks(ev){

  }
  function crossCounts(events){
    var rows = ATTRS[0].opts.concat([['', '未回答']]);

    var c = {};
    rows.forEach(function(r){ c[r[0]] = {}; cols.forEach(function(k){ c[r[0]][k[0]] = 0; }); });
    events.forEach(function(ev){
      recsOf(ev.id).forEach(function(rec){
        Object.keys(rec.people).forEach(function(k){
          var n = Math.max(0, Math.floor(num(rec.people[k])));
          var p = k.split('|'), rv = p[0] || '', cv = p[1] || '';
          if (!c[rv]) rv = '';

  /* ---------- 保存 ---------- */
  function setSave(s){
    state.save = s;

    if (!el) return;
    var text = {idle: '', saving: '保存中…', saved: (window.APP_UNSYNCED > 0 ? '端末に保存しました(通信がつながると自動で送られます)' : '保存しました'), error: '保存できませんでした。通信状況を確認して、もう一度操作してください', local: '保存されません(この画面を閉じると消えます)'}[s];
    el.textContent = text;
    el.classList.toggle('is-error', s === 'error' || s === 'local');
  }
  function persist(path, getData, delay){
    if (!db){ setSave('local'); return; }
    pending.add(path);
    var w = writers.get(path);
    if (!w){ w = {timer: null, running: false, again: false}; writers.set(path, w); }
    clearTimeout(w.timer);
    setSave('saving');
    w.timer = setTimeout(function(){ flush(path, getData); }, delay === undefined ? 300 : delay);
  }
  function flush(path, getData){
    var w = writers.get(path);
    w.timer = null;
    if (w.running){ w.again = true; return; }
    w.running = true;
    (async function(){
      try{
        do{
          w.again = false;
          var data = getData();
          if (data === null) await db.doc(path).delete();
          else await db.doc(path).set(data);
        } while (w.again);
        w.running = false;
        if (!w.timer) pending.delete(path);
        if (!othersBusy(w)) setSave('saved');
      }catch(e){
        w.running = false;
        if (!w.timer) pending.delete(path);
        setSave('error');
      }
    })();
  }
  function othersBusy(self){
    var busy = false;

  }
  function saveMenu(id){

  /* ---------- スナップショット ---------- */

  function pad2(n){ return (n < 10 ? '0' : '') + n; }

  function download(name, text, type){
    var blob = new Blob([text], {type: type});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');

    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);

  function recordsCsv(){

      var ev = eventById(r.eventId), sp0 = recSplit(r);

  /* --- 仕入れ品(材料) --- */

      '<datalist id="unit-list"><option value="本"><option value="缶"><option value="パック"><option value="箱"><option value="袋"></datalist>' +

      (state.confirm && state.confirm.kind === 'item' ? '<p class="note" style="margin:14px 0 0">削除すると、ドリンクの材料からも外れます(過去の記録の売上は残ります)。</p>' : '') +

  /* --- 仕入れ・在庫 --- */
  function stockHTML(){

    var menu = sortedMenu();
    var sold = soldMap(ev.id);
    var lines = stockLines(ev);

    var hint = '';
    var prev = prevStockEvent(ev);
    if (prev){
      var lo = leftoversOf(prev);
      var parts = Object.keys(lo).map(function(key){
        var inf = keyInfo(key);
        return inf ? esc(inf.name) + ' ' + fq(lo[key]) + esc(inf.unit) : '';
      }).filter(Boolean);
      if (parts.length){
        hint = '<div class="carry-hint"><div>前回のイベント「' + esc(prev.name) + '」(' + fmtDate(prev.date) + ')の残り:<strong> ' + parts.join('、') + '</strong></div>' +
          '<button class="btn btn-quiet" data-act="carry-fill">この数を持ち越しに入れる</button></div>';
      }
    }

    /* 1) 出すドリンクと、想定する杯数 */
    var drinkRows;
    if (!menu.length){
      drinkRows = '<div class="empty">メニューがありません。「メニュー」タブでドリンクを追加してください。</div>';
    } else {
      drinkRows = menu.map(function(m){
        var on = ev.menuIds.indexOf(m.id) !== -1;
        var pl = ev.plan[m.id] === undefined ? '' : ev.plan[m.id];

        return '<div class="plan-row' + (on ? '' : ' is-off') + '">' +
          '<label class="s-name"><input type="checkbox" data-chk="' + esc(m.id) + '"' + (on ? ' checked' : '') + '><span>' + esc(m.name) + '</span><span class="price">' + yen(m.price) + '</span></label>' +
          '<div class="plan-how">' + how + '</div>' +
          '<div><span class="cap-m">想定する杯数</span><input type="number" min="0" step="1" inputmode="numeric" aria-label="' + esc(m.name) + 'の想定する杯数" data-plan="' + esc(m.id) + '" placeholder="杯" value="' + pl + '"' + (on ? '' : ' disabled') + '></div>' +
          '</div>';
      }).join('');
    }
    var drinkPanel = '<div class="panel"><h2>このイベントで出すドリンク</h2>' +
      '<p class="note">出すドリンクにチェックを入れます。「想定する杯数」は、何杯くらい出そうか、の見込みです(空欄でもかまいません)。入れると、下の「仕入れ・在庫」に、何本買えばよいかの目安が出ます。</p>' +
      eventSelect('stock-event', ev.id) +
      '<div class="plan-head"><div>ドリンク</div><div>数え方</div><div>想定する杯数</div></div>' + drinkRows + '</div>';

    /* 2) 仕入れ・在庫(仕入れの単位ごと) */
    var planAny = lines.some(function(l){ return planNeed(ev, l) > 0; });
    var planHint = '<div class="carry-hint" id="plan-hint"' + (planAny ? '' : ' style="display:none"') + '><div>想定する杯数から、仕入れの目安を計算しました(前回からの持ち越し分は引いてあります)。少し余裕を見て、多めに買うのがおすすめです。</div>' +
        '<button class="btn btn-quiet" data-act="stock-plan-fill">目安を「今回の仕入れ」に入れる</button></div>';
    var rows;
    if (!lines.length){
      rows = '<div class="empty">出すドリンクにチェックを入れると、ここに仕入れの行が出ます。</div>';
    } else {
      rows = '<div class="stock-head"><div>仕入れ品・ドリンク</div><div>前回からの持ち越し</div><div>今回の仕入れ</div><div>買い出しライン</div><div class="num">使った</div><div class="num">残り</div><div>買い足した分</div></div>' +
        lines.map(function(l){
          var rem = lineRem(ev, l, sold), lv = lineLevel(ev, l, rem);
          var u = esc(l.unit);
          var remClass = lv === 'out' ? 'rem-out' : (lv === 'low' ? 'rem-low' : 'rem-ok');
          var carryV = ev.carryIn[l.key] === undefined ? '' : ev.carryIn[l.key];
          var stockV = ev.stock[l.key] === undefined ? '' : ev.stock[l.key];
          var lineV = ev.alertAt[l.key] === undefined ? '' : ev.alertAt[l.key];
          var k = esc(l.key);
          var sub = l.kind === 'item'
            ? '1' + u + '=' + fq(l.size) + esc(l.mu) + (l.price !== null ? '・' + yen(l.price) : '・値段未入力')
            : '1杯=1' + u + (l.price !== null ? '・原価' + yen(l.price) : '・原価未入力');
          var use = l.kind === 'item'
            ? (l.uses.length ? '使う: ' + l.uses.map(function(x){ return esc(x.drink.name) + ' ' + fq(x.amount) + esc(l.mu); }).join('、') : '今回は使うドリンクが選ばれていません')
            : '';
          return '<div class="stock-row">' +
            '<div class="s-name2"><div class="sn">' + esc(l.name) + '</div><div class="s-sub">' + sub + '</div>' + (use ? '<div class="s-sub">' + use + '</div>' : '') +
              '<div class="s-need" id="need-' + k + '">' + needText(ev, l) + '</div></div>' +
            '<div><span class="cap-m">前回からの持ち越し</span><input type="number" min="0" step="any" inputmode="decimal" aria-label="' + esc(l.name) + 'の前回からの持ち越し" data-carry="' + k + '" placeholder="' + u + '" value="' + carryV + '"></div>' +
            '<div><span class="cap-m">今回の仕入れ</span><input type="number" min="0" step="1" inputmode="numeric" aria-label="' + esc(l.name) + 'の今回の仕入れ" data-stock="' + k + '" placeholder="' + u + '" value="' + stockV + '"></div>' +
            '<div><span class="cap-m">買い出しライン</span><input type="number" min="0" step="any" inputmode="decimal" aria-label="' + esc(l.name) + 'の買い出しライン" data-line="' + k + '" placeholder="' + u + '" value="' + lineV + '"></div>' +
            '<div class="num"><span class="cap-m">使った</span><span id="used-' + k + '">' + fq(lineUsed(l, sold)) + u + '</span></div>' +
            '<div class="num ' + remClass + '" id="remw-' + k + '"><span class="cap-m">残り</span><span id="rem-' + k + '">' + (rem === null ? '―' : fq(rem) + u) + '</span><div class="s-sub" id="remc-' + k + '">' + lineCupsText(l, rem) + '</div></div>' +
            '<div><span class="cap-m">買い足した分</span><div class="add-stock"><input type="number" min="1" step="1" inputmode="numeric" id="add-' + k + '" aria-label="' + esc(l.name) + 'の買い足した数" data-enter="stock-add" data-id="' + k + '" placeholder="' + u + '"><button class="btn btn-quiet" data-act="stock-add" data-id="' + k + '">追加</button></div></div>' +
            '</div>';
        }).join('');
    }
    return drinkPanel + '<div class="panel"><h2>仕入れ・在庫</h2>' +
      '<p class="note">仕入れは、買うときの単位(本・缶など)で数えます。「持ち越し」は前回のイベントから残った数(開けた分は0.5本のように小数でも入れられます)、「今回の仕入れ」は今回新しく買った数です。残りは、持ち越し＋今回の仕入れ−使った分で計算します。ウイスキーや炭酸水などの材料は、売れた杯数と「1杯あたりの量」から、使った分を自動で計算します。「買い出しライン」は、残りがこの数以下になったら受付画面で知らせる目安です。途中で買い足したときは、数を入れて「追加」を押すと、今回の仕入れに足されます。</p>' +
      hint + planHint + rows + '</div>';

    /* --- 受付 --- */
  /* 受付の形: entry=1杯目(参加費込み) / first=1杯目(ドリンクを購入) / extra=2杯目以降 / plain=都度払い */
  function evMode(ev){
    if (ev.oneDrink) return state.firstDrink ? 'entry' : 'extra';
    if (ev.firstPaid) return state.firstDrink ? 'first' : 'extra';
    return 'plain';
  }
  function receiveHTML(){
    var ev = pickEvent('recvEventId');
    if (!ev) return '<div class="panel"><h2>受付</h2><div class="empty">先に「イベント」タブでイベントを追加してください。</div></div>';
    var drinks = eventDrinks(ev);
    var sold = soldMap(ev.id);
    var f = eventFinance(ev);
    var cart = state.cart;
    var mode = evMode(ev);
    var fees = eventFees(ev);

    var low = [];
    stockLines(ev).forEach(function(l){
      if (!l.uses.length) return;
      var rem = lineRem(ev, l, sold), lv = lineLevel(ev, l, rem);
      if (lv === 'low' || lv === 'out') low.push({l: l, rem: rem, lv: lv});
    });
    var alertHTML = low.length
      ? '<div class="alert" role="alert">買い出しの目安になりました<ul>' + low.map(function(x){
          var cupsTxt = lineCupsText(x.l, x.rem), u = esc(x.l.unit);
          return '<li>' + esc(x.l.name) + ':' + (x.lv === 'out'
            ? (x.l.kind === 'item' ? 'もう足りません(残り' + fq(Math.max(x.rem, 0)) + u + ')' : '在庫がありません')
            : '残り' + fq(x.rem) + u + (cupsTxt ? '(' + cupsTxt + ')' : '')) + '</li>';
        }).join('') + '</ul></div>'
      : '';

    var P = cart.people;
    var peopleN = peopleTotal(P);
    /* 1) 参加の種類(学生・社会人など)を選ぶ → 2) 性別を押して人数を数える */
    var curFee = fees.filter(function(f){ return f.id === state.recvFee; })[0] || fees[0];
    var feeTotals = {};
    Object.keys(P).forEach(function(k){ var fid = k.split('|')[2]; if (fid && P[k] > 0) feeTotals[fid] = (feeTotals[fid] || 0) + P[k]; });
    var feeSeg = '<div class="seg fee-seg" role="group" aria-label="参加の種類">' + fees.map(function(f){
      var c = feeTotals[f.id] || 0;
      return '<button data-act="recv-fee" data-id="' + esc(f.id) + '" aria-pressed="' + (f.id === curFee.id) + '"><span class="fs-name">' + esc(f.name) + '</span>' +
        (mode === 'entry' ? '<span class="fs-price">' + yen(f.price) + '</span>' : '') +
        (c ? '<span class="fs-n">' + c + '人</span>' : '') + '</button>';
    }).join('') + '</div>';
    function gcell(g){
      var key = personKey(g[0], curFee.o, curFee.id), n = P[key] || 0;
      var gl = g[1] || '指定しない';
      var nm = gl + '(' + curFee.name + ')';
      return '<div class="pcell' + (n > 0 ? ' on' : '') + '"><div class="pl">' + esc(gl) + '</div>' +
        '<div class="pctl"><button data-act="person" data-k="' + esc(key) + '" data-d="-1" aria-label="' + esc(nm) + 'を1人減らす"' + (n > 0 ? '' : ' disabled') + '>−</button>' +
        '<div class="n" aria-live="polite">' + n + '</div>' +
        '<button class="plus" data-act="person" data-k="' + esc(key) + '" data-d="1" aria-label="' + esc(nm) + 'を1人増やす">＋</button></div></div>';
    }
    var gcells = ATTRS[0].opts.concat([['', '']]).map(gcell).join('');
    var feeWarn = (mode === 'entry' && !sortedFees().length)
      ? '<p class="banner">参加費がまだ設定されていません(今は0円で計算します)。「参加費」タブで、学生・社会人などの金額を設定してください。</p>' : '';
    var attrHTML = mode === 'extra' ? '' : '<div class="people">' +
      '<div class="people-head"><div class="gl"><span class="stepn">1</span>' + (mode === 'entry' ? '参加の種類を選ぶ' : '区分を選ぶ') + '<span class="ptotal">計' + peopleN + '人</span></div></div>' +
      feeSeg +
      '<div class="people-head" style="margin-top:18px"><div class="gl"><span class="stepn">2</span>性別を押して人数を数える<span class="soft">(' + esc(curFee.name) + ')</span></div></div>' +
      '<div class="pgrid" style="--cols:3;--cols-s:3">' + gcells + '</div>' +
      '<p class="attr-note">種類を選んでから、1人につき1回、性別の「＋」を押します。種類を変えると、別の種類の人数も続けて数えられます。押しすぎたときは「−」で減らせます。「記録する」を押すとリセットされます。</p></div>';

    var cupsNow = Object.keys(cart.items).reduce(function(a, id){ return a + (cart.items[id] || 0); }, 0);
    var capped = mode === 'entry' || mode === 'first';
    var full = capped && cupsNow >= peopleN;
    var cards;
    if (!drinks.length){
      cards = '<div class="empty">このイベントで出すドリンクが選ばれていません。「仕入れ・在庫」タブでチェックを入れてください。</div>';
    } else {
      cards = '<div class="drink-grid">' + drinks.map(function(m){
