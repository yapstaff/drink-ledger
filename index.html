      '<div class="sum"><div class="cap">ドリンク仕入れ代(今回買った分)</div><div class="amt">' + yen(f.purchase) + '</div></div>' +
      '<div class="sum"><div class="cap">備品などの支払い</div><div class="amt">' + yen(f.paid) + '</div></div>' +
      '<div class="sum"><div class="cap">現金の収支</div><div class="amt ' + (f.cash >= 0 ? 'pos' : 'neg') + '">' + yen(f.cash) + '</div></div>' +
      '<div class="sum"><div class="cap">次回に持ち越すドリンク(原価)</div><div class="amt">' + yen(leftoverVal) + '</div></div>' +
      '<div class="sum"><div class="cap">次回に持ち越す備品</div><div class="amt">' + yen(carryOutVal) + '</div></div></div>' +
      '<p class="note" style="margin:14px 0 0">「利益」は、実際に使った分だけで計算します(売上−売れたドリンクの原価−今回使った経費)。「現金の収支」は、実際に買った分・払った分で計算するため、残りを次回に回すと利益より低く出ます。' + (hasSplit ? '相手に渡す分は、売上にも利益にも入っていません。ドリンクの仕入れ代は、支払い元を分けて記録していません。' : '') + (scope === 'all' ? '持ち越すドリンクは、直近のイベントの残りです。' : '') + '</p>';
    var perEvent = '';
    if (scope === 'all' && events.length > 1){
      perEvent = '<div class="divider"></div><h3>イベント別</h3><div class="table-wrap"><table><thead><tr><th>イベント名</th><th>開催日</th><th class="num">来場</th><th class="num">杯数</th><th class="num">' + (hasSplit ? '預かった金額' : '売上') + '</th>' + (hasSplit ? '<th class="num">相手に渡す分</th>' : '') + '<th class="num">利益</th></tr></thead><tbody>' +
        events.map(function(e){
          var x = eventFinance(e);
          return '<tr><td>' + esc(e.name) + '</td><td>' + fmtDate(e.date) + '</td><td class="num">' + x.visitors + '人</td><td class="num">' + x.cups + '杯</td><td class="num">' + yen(x.revenue) + '</td>' + (hasSplit ? '<td class="num">' + yen(x.partnerRev) + '</td>' : '') + '<td class="num">' + yen(x.profit) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    }

    var cross = crossCounts(target);
    var crossHTML;
    if (!f.visitors){
      crossHTML = '<div class="empty">この範囲には、まだ受付の記録がありません。</div>';
    } else {
      crossHTML = '<div class="table-wrap"><table><thead><tr><th>' + esc(ATTRS[0].label) + ' \\ ' + esc(ATTRS[1].label) + '</th>' +
        cross.cols.map(function(c){ return '<th class="num">' + c[1] + '</th>'; }).join('') + '<th class="num">合計</th></tr></thead><tbody>' +
        cross.rows.map(function(r){
          var sum = 0;
          var tds = cross.cols.map(function(c){ var v = cross.c[r[0]][c[0]]; sum += v; return '<td class="num">' + v + '</td>'; }).join('');
          return '<tr><td>' + r[1] + '</td>' + tds + '<td class="num"><strong>' + sum + '</strong></td></tr>';
        }).join('') +
        '<tr><td><strong>合計</strong></td>' + cross.cols.map(function(c){
          var s = 0; cross.rows.forEach(function(r){ s += cross.c[r[0]][c[0]]; });
          return '<td class="num"><strong>' + s + '</strong></td>';
        }).join('') + '<td class="num"><strong>' + f.visitors + '</strong></td></tr></tbody></table></div>';
    }

    var rankHTML = rank.length
      ? '<div class="table-wrap"><table><thead><tr><th>順位</th><th>ドリンク名</th><th class="num">販売数</th>' + (hasOne ? '<th class="num">うちワンドリンク</th>' : '') + '<th class="num">ドリンク売上</th></tr></thead><tbody>' +
        rank.map(function(r, i){ return '<tr><td>' + (i + 1) + '</td><td>' + esc(r.name) + '</td><td class="num">' + r.qty.toLocaleString('ja-JP') + '杯</td>' + (hasOne ? '<td class="num">' + r.free + '杯</td>' : '') + '<td class="num">' + yen(r.revenue) + '</td></tr>'; }).join('') +
        '</tbody></table></div>'
      : '<div class="empty">この範囲には、まだ売上の記録がありません。「受付」で記録すると表示されます。</div>';

    var feeMap = {}, feeOrder = [];
    target.forEach(function(e){
      recsOf(e.id).forEach(function(r){
        if (r.kind !== 'entry') return;
        Object.keys(r.people).forEach(function(k){
          var n = Math.max(0, Math.floor(num(r.people[k]))); if (!n) return;
          var fid = k.split('|')[2] || '';
          var nm = (fid && r.feeNames[fid]) || (fid ? '' : '') || '参加費(旧形式)';
          var pr = (fid && r.feePrices[fid] !== undefined) ? num(r.feePrices[fid]) : (Object.keys(r.feePrices).length ? 0 : num(r.fee));
          var key = nm + '|' + pr;
          if (!feeMap[key]){ feeMap[key] = {name: nm, price: pr, n: 0}; feeOrder.push(key); }
          feeMap[key].n += n;
        });
      });
    });
    var feeHTML = feeOrder.length
      ? '<div class="panel"><h2>参加費の内訳</h2><div class="table-wrap"><table><thead><tr><th>種類</th><th class="num">1人あたり</th><th class="num">人数</th><th class="num">参加費収入</th></tr></thead><tbody>' +
        feeOrder.map(function(k){ var x = feeMap[k]; return '<tr><td>' + esc(x.name) + '</td><td class="num">' + yen(x.price) + '</td><td class="num">' + x.n + '人</td><td class="num">' + yen(x.price * x.n) + '</td></tr>'; }).join('') +
        '<tr><td><strong>合計</strong></td><td></td><td class="num"><strong>' + feeOrder.reduce(function(a, k){ return a + feeMap[k].n; }, 0) + '人</strong></td><td class="num"><strong>' + yen(f.entry) + '</strong></td></tr></tbody></table></div></div>'
      : '';
    var splitHTML = '';
    if (hasSplit){
      var trow = function(label, v, cls){ return '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + label + '</td><td class="num">' + yen(v) + '</td></tr>'; };
      splitHTML = '<div class="panel"><h2>お金の分け方(' + esc(pn) + 'と' + esc(on) + ')</h2><div class="table-wrap"><table class="split-table"><tbody>' +
        trow('受付で預かった金額', f.revenue, 'strong') +
        trow(esc(on) + 'の取り分', f.ownRev) +
        trow(esc(pn) + 'に渡す金額', f.partnerRev, 'strong') +
        (f.entryP > 0 ? trow('<span class="indent">参加費・チケット代のうち' + esc(pn) + 'の分</span>', f.entryP) : '') +
        (f.drinkP > 0 ? trow('<span class="indent">' + esc(pn) + 'のドリンク(ワインなど)の売上</span>', f.drinkP) : '') +
        (f.surP > 0 ? trow('<span class="indent">追加料金(ワインなど)のうち' + esc(pn) + 'の分</span>', f.surP) : '') +
        (f.partnerExp > 0 ? trow(esc(pn) + 'が負担した備品(参考。渡す金額には入れていません)', f.partnerExp) : '') +
        '</tbody></table></div><p class="note" style="margin:14px 0 0">受付で記録した時点の設定で計算しています。「渡す金額」は、受付で預かったお金のうち、相手のものとして分けた金額です。</p></div>';
    }
    var srcs = sourceTotals(target), srcHTML = '';
    if (srcs.some(function(s){ return s.name !== '(支払い元なし)'; })){
      srcHTML = '<div class="panel"><h2>備品などの支払い元別</h2><div class="table-wrap"><table><thead><tr><th>支払い元</th><th class="num">' + esc(on) + 'の負担</th><th class="num">' + esc(pn) + 'の負担</th><th class="num">合計</th></tr></thead><tbody>' +
        srcs.map(function(s){ return '<tr><td>' + esc(s.name) + '</td><td class="num">' + yen(s.own) + '</td><td class="num">' + yen(s.partner) + '</td><td class="num">' + yen(s.own + s.partner) + '</td></tr>'; }).join('') +
        '</tbody></table></div><p class="note" style="margin:14px 0 0">今回買った備品の支払い額です(前回の残りを使った分は入っていません)。</p></div>';
    }
    var finalHTML = '';
    if (hasSplit){
      var frow = function(label, v, cls){ return '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + label + '</td><td class="num">' + (v < 0 ? '−' + yen(-v) : yen(v)) + '</td></tr>'; };
      finalHTML = '<h3>最終的な収益(' + esc(title) + ')</h3><div class="final-grid">' +
        '<div class="final-card"><h3>' + esc(on) + '</h3><div class="final-amt ' + (f.profit >= 0 ? 'pos' : 'neg') + '" id="final-own">' + yen(f.profit) + '</div>' +
          '<table class="split-table"><tbody>' +
          frow('取り分(ドリンク売上・チケット代の自分たちの分)', f.ownRev) +
          frow('売れたドリンクの原価', -f.cost) +
          frow('経費(' + esc(on) + 'の負担)', -f.expense) +
          '</tbody></table></div>' +
        '<div class="final-card"><h3>' + esc(pn) + '</h3><div class="final-amt ' + (f.partnerProfit >= 0 ? 'pos' : 'neg') + '" id="final-partner">' + yen(f.partnerProfit) + '</div>' +
          '<table class="split-table"><tbody>' +
          frow('取り分(チケット代・ワイン・追加料金)', f.partnerRev) +
          frow('負担した備品', -f.partnerExp) +
          '</tbody></table></div></div>' +
        '<p class="note" style="margin:14px 0 0">' + esc(on) + 'の収益は、上の「利益」と同じ金額です。' + esc(pn) + 'の収益は、受け取る金額から、' + esc(pn) + 'が負担した備品を引いた金額です。' + esc(pn) + 'が用意したワインなどの仕入れ代は、記録していないため入っていません。</p><div class="divider"></div>';
    }
    return '<div class="panel"><h2>レポート</h2>' + select + warn + finalHTML + sums + perEvent + '</div>' + splitHTML +
      '<div class="panel"><h2>お金の動きと持ち越し</h2>' + cashHTML + '</div>' + srcHTML + feeHTML +
      '<div class="panel"><h2>来場者の内訳(人数)</h2>' + crossHTML + '</div>' +
      '<div class="panel"><h2>売れ筋ランキング</h2>' + rankHTML + '</div>';
  }

  /* ---------- 操作 ---------- */
  function val(id){ var el = $('#' + id); return el ? el.value : ''; }
  function fail(scope, msg){ state.formError = {scope: scope, msg: msg}; render(); }
  function clearMsgs(){ state.formError = null; state.confirm = null; }
  function resetCart(){ state.cart = {people: {}, items: {}, none: false}; }

  async function deleteRecordsSeq(ids){
    if (!db) return;
    ids.forEach(function(id){ pending.add('records/' + id); });
    setSave('saving');
    try{
      for (var i = 0; i < ids.length; i++){
        await db.doc('records/' + ids[i]).delete();
        pending.delete('records/' + ids[i]);
      }
      setSave('saved');
    }catch(e){
      ids.forEach(function(id){ pending.delete('records/' + id); });
      setSave('error');
    }
  }

  var actions = {
    'group': function(el){
      var g = GROUPS.filter(function(x){ return x.id === el.dataset.v; })[0];
      if (!g) return;
      state.tab = lastTab[g.id] || g.tabs[0][0]; clearMsgs();
      if (state.tab !== 'events') state.editingEventId = null;
      render();
    },
    'tab': function(el){
      state.tab = el.dataset.v; clearMsgs();
      if (state.tab !== 'events') state.editingEventId = null;
      render();
    },
    'confirm-no': function(){ state.confirm = null; render(); },

    'ev-save': function(){
      var name = val('ev-name').trim();
      if (!name) return fail('event', 'イベント名を入力してください。');
      var date = val('ev-date'), venue = val('ev-venue').trim();
      var styleEl = $('#ev-style'), style = styleEl ? styleEl.value : 'ticket';
      var one = style === 'ticket', firstPaid = style === 'first', partner = val('ev-partner').trim(), ownName = val('ev-own').trim();
      state.formError = null;
      if (state.editingEventId){
        var ev = eventById(state.editingEventId);
        if (ev){ ev.name = name; ev.date = date; ev.venue = venue; ev.oneDrink = one; ev.firstPaid = firstPaid; ev.partner = partner; ev.ownName = ownName; saveEvent(ev.id, 0); }
        state.editingEventId = null;
        toast('イベントを更新しました');
      } else {
        var id = uid();
        state.events.push({id: id, name: name, date: date, venue: venue, oneDrink: one, firstPaid: firstPaid, partner: partner, ownName: ownName, feeIds: sortedFees().filter(function(f){ return f.std; }).map(function(f){ return f.id; }),
          menuIds: sortedMenu().map(function(m){ return m.id; }), stock: {}, alertAt: {}, carryIn: {}, plan: {}, expenses: [], createdAt: Date.now()});
        state.recvEventId = id; state.stockEventId = id; state.expenseEventId = id;
        saveEvent(id, 0);
        toast('イベントを追加しました');
      }
      render();
    },
    'ev-cancel': function(){ state.editingEventId = null; state.formError = null; render(); },
    'ev-edit': function(el){ state.editingEventId = el.dataset.id; state.confirm = null; state.formError = null; render(); },
    'ev-delete': function(el){ state.confirm = {kind: 'ev', id: el.dataset.id}; render(); },
    'ev-delete-yes': function(el){
      var id = el.dataset.id;
      var recIds = recsOf(id).map(function(r){ return r.id; });
      state.events = state.events.filter(function(e){ return e.id !== id; });
      state.records = state.records.filter(function(r){ return r.eventId !== id; });
      recordsChanged();
      state.confirm = null;
      saveEvent(id, 0);
      deleteRecordsSeq(recIds);
      toast('イベントを削除しました');
      render();
    },

    'menu-add': function(){
      var name = val('mn-name').trim();
      if (!name) return fail('menu', 'ドリンク名を入力してください。');
      var priceRaw = val('mn-price');
      if (priceRaw === '') return fail('menu', '販売価格を入力してください。');
      var costRaw = val('mn-cost');
      var order = state.menu.reduce(function(a, m){ return Math.max(a, m.order || 0); }, 0) + 1;
      var id = uid();
      state.menu.push({id: id, name: name, price: Math.max(0, num(priceRaw)), cost: costRaw === '' ? null : Math.max(0, num(costRaw)), recipe: [], priceRefill: null, payee: 'own', entryExtra: 0, order: order});
      state.formError = null;
      saveMenu(id);
      toast('ドリンクを追加しました');
      render();
    },
    'menu-delete': function(el){ state.confirm = {kind: 'menu', id: el.dataset.id}; render(); },
    'menu-delete-yes': function(el){
      var id = el.dataset.id;
      state.menu = state.menu.filter(function(m){ return m.id !== id; });
      state.confirm = null;
      saveMenu(id);
      toast('ドリンクを削除しました');
      render();
    },

    'stock-add': function(el){
      var ev = eventById(state.stockEventId);
      if (!ev) return;
      var id = el.dataset.id;
      var n = Math.floor(num(val('add-' + id)));
      if (n <= 0){ toast('追加する数を入力してください'); return; }
      ev.stock[id] = Math.max(0, Math.floor(num(ev.stock[id]))) + n;
      saveEvent(ev.id, 0);
      var inf = keyInfo(id);
      toast((inf ? inf.name : '') + 'を' + n + (inf ? inf.unit : '本') + '追加しました(仕入れ合計 ' + ev.stock[id] + (inf ? inf.unit : '本') + ')');
      render();
    },

    'export-json': function(){ download('ドリンク収支帳_全データ_' + todayStr() + '.json', JSON.stringify(backupObject(), null, 1), 'application/json'); toast('全データを書き出しました'); },
    'export-records': function(){ download('ドリンク収支帳_記録一覧_' + todayStr() + '.csv', recordsCsv(), 'text/csv;charset=utf-8'); toast('記録の一覧を書き出しました'); },
    'export-events': function(){ download('ドリンク収支帳_イベント別_' + todayStr() + '.csv', eventsCsv(), 'text/csv;charset=utf-8'); toast('イベント別の集計を書き出しました'); },
    'imp-cancel': function(){ state.importData = null; state.importMsg = ''; render(); },
    'imp-go': function(){
      var d = state.importData;
      if (!d) return;
      d.menu.forEach(function(x){ upsert(state.menu, normMenu(x.id, x.data)); saveMenu(x.id); });
      d.items.forEach(function(x){ upsert(state.items, normItem(x.id, x.data)); saveItem(x.id); });
      d.fees.forEach(function(x){ upsert(state.fees, normFee(x.id, x.data)); saveFee(x.id, 0); });
      d.events.forEach(function(x){ upsert(state.events, normEvent(x.id, x.data)); saveEvent(x.id, 0); });
      d.records.forEach(function(x){ upsert(state.records, normRecord(x.id, x.data)); });
      recordsChanged();
      d.records.forEach(function(x){ saveRecord(x.id); });
      state.importData = null; state.importMsg = '';
      toast('取り込みました');
      render();
    },
    'signout': function(){ if (window.APP_SIGNOUT) window.APP_SIGNOUT(); },
    'recv-fee': function(el){ state.recvFee = el.dataset.id; render(); },
    'fee-add': function(){
      var name = val('fee-name').trim();
      if (!name) return fail('fee', '参加費の名前を入力してください(例:学生、大人、○○大学生)。');
      var priceRaw = val('fee-price');
      if (priceRaw === '') return fail('fee', '金額を入力してください(無料なら0)。');
      var o = val('fee-o');
      var order = state.fees.reduce(function(a, f){ return Math.max(a, f.order || 0); }, 0) + 1;
      var id = uid();
      state.fees.push({id: id, name: name, price: Math.max(0, num(priceRaw)), o: (o === 's' || o === 'w') ? o : '', std: true, share: Math.min(Math.max(0, num(priceRaw)), Math.max(0, num(val('fee-share')))), order: order});
      state.formError = null;
      saveFee(id);
      toast('参加費を追加しました');
      render();
    },
    'fee-delete': function(el){ state.confirm = {kind: 'fee', id: el.dataset.id}; render(); },
    'fee-delete-yes': function(el){
      var id = el.dataset.id;
      state.fees = state.fees.filter(function(f){ return f.id !== id; });
      state.confirm = null;
      saveFee(id);
      toast('参加費を削除しました');
      render();
    },
    'item-add': function(){
      var name = val('it-name').trim();
      if (!name) return fail('item', '品名を入力してください(例:ジンジャエール)。');
      var size = num(val('it-size'));
      if (!(size > 0)) return fail('item', '1単位の量を入力してください(例:1500)。');
      var unit = val('it-unit').trim() || '本', mu = val('it-mu').trim() || 'ml';
      var priceRaw = val('it-price');
      var order = state.items.reduce(function(a, i){ return Math.max(a, i.order || 0); }, 0) + 1;
      var id = uid();
      state.items.push({id: id, name: name, unit: unit, size: size, mu: mu, price: priceRaw === '' ? null : Math.max(0, num(priceRaw)), order: order});
      state.formError = null;
      saveItem(id);
      toast('仕入れ品を追加しました');
      render();
    },
    'item-delete': function(el){ state.confirm = {kind: 'item', id: el.dataset.id}; render(); },
    'item-delete-yes': function(el){
      var id = el.dataset.id;
      state.items = state.items.filter(function(i){ return i.id !== id; });
      state.menu.forEach(function(d){
        var keep = d.recipe.filter(function(x){ return x.itemId !== id; });
        if (keep.length !== d.recipe.length){ d.recipe = keep; saveMenu(d.id); }
      });
      state.confirm = null;
      saveItem(id);
      toast('仕入れ品を削除しました');
      render();
    },
    'recipe-edit': function(el){ state.recipeEdit = (state.recipeEdit === el.dataset.id) ? null : el.dataset.id; render(); },
    'recipe-done': function(){ state.recipeEdit = null; render(); },
    'recipe-add': function(el){
      var m = drinkById(el.dataset.id);
      if (!m) return;
      var first = sortedItems()[0];
      m.recipe.push({itemId: first ? first.id : '', amount: 0});
      saveMenu(m.id);
      render();
    },
    'recipe-del': function(el){
      var m = drinkById(el.dataset.id);
      if (!m) return;
      m.recipe.splice(Number(el.dataset.i), 1);
      saveMenu(m.id);
      render();
    },
    'stock-plan-fill': function(){
      var ev = eventById(state.stockEventId);
      if (!ev) return;
      var n = 0;
      stockLines(ev).forEach(function(l){
        if (planNeed(ev, l) > 0){ ev.stock[l.key] = planBuy(ev, l); n++; }
      });
      saveEvent(ev.id, 0);
      toast('仕入れの目安を入れました(' + n + '種類)');
      render();
    },
    'carry-fill': function(){
      var ev = eventById(state.stockEventId);
      if (!ev) return;
      var prev = prevStockEvent(ev);
      if (!prev) return;
      var lo = leftoversOf(prev), n = 0;
      Object.keys(lo).forEach(function(id){
        if (drinkById(id) && ev.menuIds.indexOf(id) === -1) ev.menuIds.push(id);
        ev.carryIn[id] = lo[id]; n++;
      });
      saveEvent(ev.id, 0);
      toast('前回の残りを持ち越しに入れました(' + n + '種類)');
      render();
    },
    'person': function(el){
      var k = el.dataset.k, d = Number(el.dataset.d);
      var n = Math.max(0, (state.cart.people[k] || 0) + d);
      if (n === 0) delete state.cart.people[k]; else state.cart.people[k] = n;
      render();
    },
    'cart': function(el){
      var id = el.dataset.id, d = Number(el.dataset.d);
      var evc = eventById(state.recvEventId);
      if (d > 0) state.cart.none = false;
      if (d > 0 && evc && (evc.oneDrink || evc.firstPaid) && state.firstDrink){
        var tot = Object.keys(state.cart.items).reduce(function(a, k){ return a + (state.cart.items[k] || 0); }, 0);
        if (tot >= peopleTotal(state.cart.people)) return;
      }
      var n = Math.max(0, (state.cart.items[id] || 0) + d);
      if (n === 0) delete state.cart.items[id]; else state.cart.items[id] = n;
      render();
    },
    'cart-clear': function(){ resetCart(); render(); },
    'cart-none': function(){
      state.cart.none = !state.cart.none;
      if (state.cart.none) state.cart.items = {};
      render();
    },
    'opt-edit': function(el){ state.optEdit = el.dataset.id; render(); },
    'opt-done': function(){ state.optEdit = null; render(); },
    'rec-save': function(){
      var ev = eventById(state.recvEventId);
      if (!ev) return;
      var mode = evMode(ev);
      var items = {}, prices = {}, names = {}, payees = {}, extras = {}, cups = 0;
      Object.keys(state.cart.items).forEach(function(id){
        var d = drinkById(id), n = state.cart.items[id];
        if (!d || n <= 0) return;
        items[id] = n; prices[id] = drinkPrice(d, mode); names[id] = d.name; cups += n;
        if (d.payee === 'partner') payees[id] = 'partner';
        if (mode === 'entry' && d.entryExtra > 0) extras[id] = d.entryExtra;
      });
      var people = {};
      Object.keys(state.cart.people).forEach(function(k){ if (state.cart.people[k] > 0) people[k] = state.cart.people[k]; });
      var pn = peopleTotal(people);
      var kind = '', fee = 0;
      var feePrices = {}, feeNames = {}, feeShares = {};
      Object.keys(people).forEach(function(k){
        var fid = k.split('|')[2], fe = fid ? feeFor(fid) : null;
        if (fe){
          feePrices[fid] = fe.price; feeNames[fid] = fe.name;
          if (mode === 'entry' && fe.share > 0) feeShares[fid] = fe.share;
        }
      });
      if (mode === 'entry'){
        if (!pn || cups > pn) return;
        kind = 'entry';
      } else if (mode === 'first'){
        if (!pn || cups > pn || (!cups && !state.cart.none)) return;
        kind = 'first';
      } else if (mode === 'extra'){
        if (!cups) return;
        kind = 'extra'; people = {}; pn = 0; feePrices = {}; feeNames = {};
      } else if (!cups || !pn) return;
      var rec = {id: uid(), eventId: ev.id, t: Date.now(), people: people, items: items, prices: prices, names: names, kind: kind, fee: fee, feePrices: feePrices, feeNames: feeNames, payees: payees, extras: extras, feeShares: feeShares};
      state.records.push(rec);
      recordsChanged();
      saveRecord(rec.id);
      resetCart();
      toast(kind === 'extra' ? cups + '杯を記録しました(2杯目以降)' : pn + '人・' + cups + '杯を記録しました(来場 ' + eventFinance(ev).visitors + '人)');
      render();
    },
    'rec-delete': function(el){ state.confirm = {kind: 'rec', id: el.dataset.id}; render(); },
    'rec-delete-yes': function(el){
      var id = el.dataset.id;
      state.records = state.records.filter(function(r){ return r.id !== id; });
      recordsChanged();
      state.confirm = null;
      saveRecord(id);
      toast('記録を取り消しました');
      render();
    },

    'exp-add': function(){
      var ev = eventById(state.expenseEventId);
      if (!ev) return;
      var label = val('exp-label').trim(), amountRaw = val('exp-amount');
      if (!label) return fail('expense', '品目を入力してください。');
      if (amountRaw === '') return fail('expense', '金額を入力してください。');
      var amt = Math.max(0, num(amountRaw)), co = Math.min(amt, Math.max(0, num(val('exp-carry'))));
      var bEl = $('#exp-bearer');
      ev.expenses.push({id: uid(), label: label, amount: amt, kind: 'new', carryOut: co, from: '', bearer: (bEl && bEl.value === 'partner') ? 'partner' : 'own', source: val('exp-source').trim()});
      state.formError = null;
      saveEvent(ev.id, 0);
      toast('経費を追加しました');
      render();
    },
    'exp-use': function(el){
      var ev = eventById(state.expenseEventId);
      if (!ev) return;
      var p = expensePool(ev).filter(function(x){ return x.id === el.dataset.id; })[0];
      if (!p) return;
      ev.expenses.push({id: uid(), label: p.label, amount: p.value, kind: 'carry', carryOut: 0, from: p.id, bearer: p.bearer, source: p.source});
      saveEvent(ev.id, 0);
      toast(p.label + 'を今回使う分として追加しました');
      render();
    },
    'exp-delete': function(el){ state.confirm = {kind: 'exp', id: el.dataset.id}; render(); },
    'exp-delete-yes': function(el){
      var ev = eventById(state.expenseEventId);
      if (!ev) return;
      ev.expenses = ev.expenses.filter(function(e){ return e.id !== el.dataset.id; });
      state.confirm = null;
      saveEvent(ev.id, 0);
      render();
    }
  };

  document.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || !$('#app').contains(el) || el.disabled) return;
    var fn = actions[el.dataset.act];
    if (fn) fn(el);
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' || e.isComposing) return;
    var t = e.target;
    if (t && t.dataset && t.dataset.enter){
      e.preventDefault();
      var fn = actions[t.dataset.enter];
      if (fn) fn(t);
    }
  });

  document.addEventListener('input', function(e){
    var t = e.target;
    if (!t || !t.dataset) return;
    if (t.dataset.expb === 'source'){
      var se = eventById(state.expenseEventId);
      var sr = se ? se.expenses.filter(function(x){ return x.id === t.dataset.id; })[0] : null;
      if (!sr) return;
      sr.source = t.value;
      saveEvent(se.id, 600);
      return;
    }
    if (t.dataset.ff === 'name' || t.dataset.ff === 'price' || t.dataset.ff === 'share'){
      var fe = feeById(t.dataset.id);
      if (!fe) return;
      if (t.dataset.ff === 'name') fe.name = t.value; else if (t.dataset.ff === 'share') fe.share = Math.max(0, num(t.value)); else fe.price = Math.max(0, num(t.value));
      saveFee(fe.id, 600);
      return;
    }
    if (t.dataset.mf){
      var m = drinkById(t.dataset.id);
      if (!m) return;
      var f = t.dataset.mf;
      if (f === 'name') m.name = t.value;
      else if (f === 'price') m.price = Math.max(0, num(t.value));
      else if (f === 'cost') m.cost = t.value === '' ? null : Math.max(0, num(t.value));
      else if (f === 'priceRefill') m.priceRefill = t.value === '' ? null : Math.max(0, num(t.value));
      else if (f === 'entryExtra') m.entryExtra = Math.max(0, num(t.value));
      var g = $('#gross-' + m.id);
      if (g) g.textContent = grossText(m);
      updateHeader();
      saveMenu(m.id);
    } else if (t.dataset.exp){
      var xe = eventById(state.expenseEventId);
      if (!xe) return;
      var row = xe.expenses.filter(function(x){ return x.id === t.dataset.id; })[0];
      if (!row) return;
      if (t.dataset.exp === 'amount') row.amount = Math.max(0, num(t.value));
      else row.carryOut = Math.max(0, num(t.value));
      var cell = $('#expc-' + row.id);
      if (cell) cell.textContent = yen(expUsed(row));
      var u = 0, pd = 0, co2 = 0, pu = 0;
      xe.expenses.forEach(function(x){ if (x.bearer === 'partner') pu += expUsed(x); else { u += expUsed(x); if (x.kind !== 'carry') pd += Math.max(0, num(x.amount)); } co2 += expCarry(x); });
      var ep = $('#exp-partner'); if (ep) ep.textContent = yen(pu);
      var e1 = $('#exp-used'), e2 = $('#exp-paid'), e3 = $('#exp-carry-sum');
      if (e1) e1.textContent = yen(u);
      if (e2) e2.textContent = yen(pd);
      if (e3) e3.textContent = yen(co2);
      saveEvent(xe.id, 600);
    } else if (t.dataset.if){
      var it = itemById(t.dataset.id);
      if (!it) return;
      var f2 = t.dataset.if;
      if (f2 === 'name') it.name = t.value;
      else if (f2 === 'unit') it.unit = t.value || '本';
      else if (f2 === 'mu') it.mu = t.value || 'ml';
      else if (f2 === 'size'){ if (num(t.value) > 0) it.size = num(t.value); }
      else if (f2 === 'price') it.price = t.value === '' ? null : Math.max(0, num(t.value));
      updateHeader();
      saveItem(it.id);
    } else if (t.dataset.ramt){
      var rm = drinkById(t.dataset.ramt);
      if (!rm) return;
      var ri = Number(t.dataset.i), rx = rm.recipe[ri];
      if (!rx) return;
      rx.amount = Math.max(0, num(t.value));
      var rc = $('#rcup-' + rm.id + '-' + ri);
      if (rc) rc.textContent = rcupText(rx);
      var ci = $('#cost-' + rm.id);
      if (ci) ci.innerHTML = costInner(rm);
      var rg = $('#gross-' + rm.id), rcost = drinkCost(rm);
      if (rg) rg.textContent = rcost === null ? '―' : yen(rm.price - rcost);
      updateHeader();
      saveMenu(rm.id);
    } else if (t.dataset.plan){
      var pe = eventById(state.stockEventId);
      if (!pe) return;
      if (t.value === '') delete pe.plan[t.dataset.plan];
      else pe.plan[t.dataset.plan] = Math.max(0, Math.floor(num(t.value)));
      var anyPlan = false;
      stockLines(pe).forEach(function(l){
        var n = $('#need-' + l.key); if (n) n.innerHTML = needText(pe, l);
        if (planNeed(pe, l) > 0) anyPlan = true;
      });
      var ph = $('#plan-hint'); if (ph) ph.style.display = anyPlan ? '' : 'none';
      saveEvent(pe.id, 600);
    } else if (t.dataset.stock || t.dataset.line || t.dataset.carry){
      var ev = eventById(state.stockEventId);
      if (!ev) return;
      var id = t.dataset.stock || t.dataset.line || t.dataset.carry;
      var map = t.dataset.stock ? ev.stock : (t.dataset.carry ? ev.carryIn : ev.alertAt);
      if (t.value === '') delete map[id];
      else map[id] = t.dataset.stock ? Math.max(0, Math.floor(num(t.value))) : Math.max(0, r3(num(t.value)));
      var sold2 = soldMap(ev.id);
      stockLines(ev).forEach(function(l){
        var rem = lineRem(ev, l, sold2), lv = lineLevel(ev, l, rem);
        var r = $('#rem-' + l.key), c = $('#remc-' + l.key), w = $('#remw-' + l.key), nd = $('#need-' + l.key);
        if (r) r.textContent = rem === null ? '―' : fq(rem) + l.unit;
        if (c) c.innerHTML = lineCupsText(l, rem);
        if (w) w.className = 'num ' + (lv === 'out' ? 'rem-out' : (lv === 'low' ? 'rem-low' : 'rem-ok'));
        if (nd) nd.innerHTML = needText(ev, l);
      });
      updateHeader();
      saveEvent(ev.id, 600);
    }
  });

  document.addEventListener('change', function(e){
    var t = e.target;
    if (!t || !t.dataset) return;
    if (t.dataset.imp && t.files && t.files[0]){
      var rd = new FileReader();
      rd.onload = function(){
        state.importData = null; state.importMsg = '';
        try{
          var o = JSON.parse(String(rd.result));
          if (!o || o.app !== 'drink-ledger') throw new Error('x');
          ['menu', 'items', 'fees', 'events', 'records'].forEach(function(k){
            if (!Array.isArray(o[k])) o[k] = [];
            o[k] = o[k].filter(function(x){ return x && typeof x.id === 'string' && x.id && x.data && typeof x.data === 'object'; });
          });
          state.importData = o;
        }catch(err){
          state.importMsg = 'このファイルは取り込めません。「全データを書き出す」で作ったファイルを選んでください。';
        }
        render();
      };
      rd.readAsText(t.files[0]);
      return;
    }
    if (t.dataset.ff === 'o' || t.dataset.ff === 'std'){
      var fe2 = feeById(t.dataset.id);
      if (!fe2) return;
      if (t.dataset.ff === 'o') fe2.o = (t.value === 's' || t.value === 'w') ? t.value : ''; else fe2.std = !!t.checked;
      saveFee(fe2.id, 0);
      return;
    }
    if (t.dataset.feechk){
      var fev = eventById(state.feeEventId);
      if (!fev) return;
      var ids = eventFees(fev).map(function(f){ return f.id; });
      var fi = ids.indexOf(t.dataset.feechk);
      if (t.checked && fi === -1) ids.push(t.dataset.feechk);
      if (!t.checked && fi !== -1) ids.splice(fi, 1);
      fev.feeIds = ids;
      saveEvent(fev.id, 300);
      render();
      return;
    }
    if (t.dataset.rsel){
      var rm2 = drinkById(t.dataset.rsel);
      if (!rm2) return;
      var rx2 = rm2.recipe[Number(t.dataset.i)];
      if (!rx2) return;
      rx2.itemId = t.value;
      saveMenu(rm2.id);
      render();
      return;
    }
    if (t.dataset.mp === 'payee'){
      var pm = drinkById(t.dataset.id);
      if (!pm) return;
      pm.payee = t.value === 'partner' ? 'partner' : 'own';
      saveMenu(pm.id);
      render();
      return;
    }
    if (t.dataset.expb === 'bearer'){
      var be = eventById(state.expenseEventId);
      var br = be ? be.expenses.filter(function(x){ return x.id === t.dataset.id; })[0] : null;
      if (!br) return;
      br.bearer = t.value === 'partner' ? 'partner' : 'own';
      saveEvent(be.id, 0);
      render();
      return;
    }
    if (t.dataset.first){
      state.firstDrink = !!t.checked;
      resetCart();
      render();
      return;
    }
    if (t.dataset.chk){
      var ev = eventById(state.stockEventId);
      if (!ev) return;
      var id = t.dataset.chk, i = ev.menuIds.indexOf(id);
      if (t.checked && i === -1) ev.menuIds.push(id);
      if (!t.checked && i !== -1) ev.menuIds.splice(i, 1);
      saveEvent(ev.id, 300);
      render();
    } else if (t.dataset.sel){
      if (t.dataset.sel === 'recv-event'){ state.recvEventId = t.value; state.firstDrink = true; resetCart(); }
      else if (t.dataset.sel === 'stock-event') state.stockEventId = t.value;
      else if (t.dataset.sel === 'expense-event') state.expenseEventId = t.value;
      else if (t.dataset.sel === 'fee-event') state.feeEventId = t.value;
      else if (t.dataset.sel === 'report-scope') state.reportScope = t.value;
      state.formError = null; state.confirm = null;
      render();
    }
  });

  /* ---------- 起動 ---------- */
  function onDbError(){
    state.dbOk = false; state.loaded = true; state.save = 'local';
    scheduleRender();
  }
  async function init(){
    render();
    var ns = null;
    try{ ns = (window.claude && window.claude.use) ? await window.claude.use('db') : null; }catch(err){ ns = null; }
    if (!ns){
      state.dbOk = false; state.loaded = true; state.save = 'local';
      render();
      return;
    }
    db = ns;
    state.dbOk = true;
    var got = {menu: false, items: false, events: false, records: false, fees: false};
    function ready(k){ got[k] = true; if (got.menu && got.items && got.events && got.records && got.fees) state.loaded = true; scheduleRender(); }
    try{
      db.collection('menu').onSnapshot(function(snap){ applyMenuSnap(snap); ready('menu'); }, onDbError);
      db.collection('items').onSnapshot(function(snap){ applyItemSnap(snap); ready('items'); }, onDbError);
      db.collection('fees').onSnapshot(function(snap){ applyFeeSnap(snap); ready('fees'); }, onDbError);
      db.collection('events').onSnapshot(function(snap){ applyEventSnap(snap); ready('events'); }, onDbError);
      db.collection('records').onSnapshot(function(snap){ applyRecordSnap(snap); ready('records'); }, onDbError);
    }catch(err){ onDbError(); }
  }
  window.addEventListener('online', function(){ render(); });
  window.addEventListener('offline', function(){ render(); });
  window.addEventListener('fb-write-error', function(){ setSave('error'); });
  window.addEventListener('fb-sync', function(){ if (state.save === 'saved') setSave('saved'); });
  init();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
